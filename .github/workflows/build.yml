name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project around index.html
        run: |
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }
          mkdir -p app/src/main/java/com/virusoid/game app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Virusoid"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.virusoid.game'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.virusoid.game'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Вирусоид"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="15" android:viewportHeight="15">
              <path android:fillColor="#0D0B1F" android:pathData="M0,0h15v15h-15z"/>
              <path android:fillColor="#4DFF88" android:pathData="M4,3.5h1v1h-1zM10,3.5h1v1h-1zM5,4.5h1v1h-1zM9,4.5h1v1h-1zM4,5.5h7v1h-7zM3,6.5h2v1h-2zM6,6.5h3v1h-3zM10,6.5h2v1h-2zM2,7.5h11v1h-11zM2,8.5h1v1h-1zM4,8.5h7v1h-7zM12,8.5h1v1h-1zM2,9.5h1v1h-1zM4,9.5h1v1h-1zM10,9.5h1v1h-1zM12,9.5h1v1h-1zM5,10.5h2v1h-2zM8,10.5h2v1h-2z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/virusoid/game/MainActivity.java <<'EOF'
          package com.virusoid.game;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setBackgroundColor(0xFF07070F);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setLongClickable(false);
                  web.setHapticFeedbackEnabled(false);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Virusoid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Virusoid-apk
          path: Virusoid.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Вирусоид APK #${{ github.run_number }}
          files: Virusoid.apk
